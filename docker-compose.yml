version: "3.9"

services:
  credit-risk-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: neostats-credit-risk-platform:latest
    container_name: credit_risk_platform
    ports:
      - "8501:8501"
    volumes:
      # Mount local /data so the evaluator can drop the real Kaggle CSVs in
      # without rebuilding the image; models persist across restarts too.
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - LOG_DIR=/app/logs
    restart: unless-stopped
